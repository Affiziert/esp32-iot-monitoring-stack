name: Smart_Home

services:
  influxdb:
    image: influxdb:2
    container_name: influxdb_2
    ports:
      - "8086:8086"
    volumes:
      - ./InfluxDB/data:/var/lib/influxdb2
      - ./InfluxDB/config:/etc/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./Grafana/data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped
